name: Deploy to Server

# 触发：推送到 main 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 失败时及时通知（可删，不影响部署）
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Node.js（22，含 node:sqlite 实验特性）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # —— 构建校验：在 CI 里先把前后端都构建一遍，提前暴露编译错误 ——
      - name: 构建前端 (app/dist)
        run: |
          npm install
          npm run build

      - name: 构建后端 (server/dist)
        run: |
          cd server
          npm install
          npm run build
          cd ..

      # —— 传输：rsync 源码到服务器（排除依赖/构建产物/数据库/ git） ——
      - name: Rsync 源码到服务器
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SOURCE: "./"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: >-
            -az --delete
            --exclude='node_modules'
            --exclude='dist'
            --exclude='server/node_modules'
            --exclude='server/dist'
            --exclude='server/data'
            --exclude='.git'
            --exclude='*.log'
            --exclude='.github'

      # —— 服务器上：装依赖 + 构建 + pm2 热重启（server/data 不在排除项里，数据库会保留） ——
      - name: 服务器上安装 / 构建 / 重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # 前端依赖 + 构建
            npm install
            npm run build

            # 后端依赖 + 编译
            cd server
            npm install
            npm run build
            cd ..

            # 用 pm2 拉起 / 热重启（--experimental-sqlite 是 node:sqlite 必需）
            pm2 reload yejiguanli || pm2 start server/dist/index.js \
              --name yejiguanli \
              --node-args="--experimental-sqlite"

            # 保存进程列表，开机自启（仅首次需要，重复执行无害）
            pm2 save
